  stages:
    - prepare
    - test
    - build
    - deploy-snapchot
    - release
    - build-release
    - deploy-release
  default:
    cache:
      paths:
        - .m2/repository
    interruptible: true
  variables:
    MAVEN_IMAGE: eclipse-temurin:25-jdk
    DOCKER_IMAGE_PATH: "$REGISTRY_URL/docker-hosted/tregusto-backend"
    SNAPSHOT_SUFFIX: "-SNAPSHOT_${CI_PIPELINE_IID}"
    DOCKER_IMAGE: docker:25.0
    DIND_IMAGE: docker:24.0.9-dind
    GITLAB_BASE_URL: gitlab.ops.gopartner.fr/tregusto
    HELM_REPO: industrialisation/helm-charts.git
    API_REPO: dev/api.git


  get-version:
    stage: prepare
    image: $MAVEN_IMAGE
    before_script:
      - apt-get update && apt-get install -y maven
    script:
      - apt-get update && apt-get install -y maven
      - echo "Retrieving application version from pom.xml"
      - APP_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
      - echo $APP_VERSION > version.txt
    artifacts:
      paths:
        - version.txt
      expire_in: 1 day


  sonarqube-check:
    stage: test
    image: $MAVEN_IMAGE
    needs:
      - job: get-version
        artifacts: true
    before_script:
      - apt-get update && apt-get install -y maven
    script:
      - APP_VERSION=$(cat version.txt)
      - IMAGE_TAG="${APP_VERSION}-${CI_PIPELINE_IID}"
      - echo " Running SonarQube analysis for version $IMAGE_TAG"
      - |
        mvn clean verify sonar:sonar \
          -Dspring.profiles.active=test \
          -Dsonar.projectKey=tregusto-backend \
          -Dsonar.projectName="Tregusto Backend" \
          -Dsonar.projectVersion=$IMAGE_TAG\
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.login=$SONAR_TOKEN
    artifacts:
      when: always
      paths:
        - target/site/jacoco/index.html
        - target/jacoco.exec
      expire_in: 1 week
    rules:
      - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
      - if: '$CI_COMMIT_BRANCH == "develop"'

  docker-build:
    stage: build
    image: docker:25.0
    services:
      - $DIND_IMAGE

    needs:
      - job: get-version
        artifacts: true
      - job: sonarqube-check
        artifacts: true
    script: |
      APP_VERSION=$(cat version.txt)
      IMAGE_TAG="${APP_VERSION}-${CI_PIPELINE_IID}"
      DOCKER_IMAGE="$REGISTRY_URL/registry/tregusto-backend"
  
      echo "Version de l'application : $IMAGE_TAG"
      echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin
  
      docker build -t $DOCKER_IMAGE:$IMAGE_TAG .
      docker push $DOCKER_IMAGE:$IMAGE_TAG
    rules:
      - if: '$CI_COMMIT_BRANCH == "develop"'

  deploy-images:
    image: docker:25.0
    stage: deploy-snapchot
    services:
      - $DIND_IMAGE

      - apk add --no-cache git bash
    script:
      - APP_VERSION=$(cat version.txt)
      - IMAGE_TAG="${APP_VERSION}-${CI_PIPELINE_IID}"
      - echo "Using IMAGE_TAG=$IMAGE_TAG from build job"
      - git clone -b HL-1 https://oauth2:${GITLAB_TOKEN}@${GITLAB_BASE_URL}/${HELM_REPO}
      - cd helm-charts/backend-tregusto
      - >
        sed -i "s/tag: \".*\"/tag: \"$IMAGE_TAG\"/" values.yaml
      - git config user.email "$GIT_EMAIL"
      - git config user.name "$GIT_USERNAME"
      - git add values.yaml
      - git commit -m "Update image tag to version $IMAGE_TAG"
      - git push origin HL-1
    rules:
      - if: '$CI_COMMIT_BRANCH == "develop"'

  release:
    stage: release
    image: maven:3.9.9-eclipse-temurin-23
    when: manual
    before_script:
      - git config user.email "$GIT_EMAIL"
      - git config user.name "$GIT_USERNAME"
      - git remote set-url origin https://oauth2:${GITLAB_TOKEN}@gitlab.ops.gopartner.fr/tregusto/tregusto/api.git
    script: |
      git fetch --all
      git checkout -B $CI_COMMIT_REF_NAME origin/$CI_COMMIT_REF_NAME
  
      RELEASE_BRANCH=${CI_COMMIT_REF_NAME}
      RELEASE_VERSION=$(echo $RELEASE_BRANCH | awk -F'/' '{print $2}')
      echo "Release version: $RELEASE_VERSION"
      
      mvn release:prepare release:perform \
        -DreleaseVersion=$RELEASE_VERSION \
        -DtagNameFormat=ag-@{project.version} \
        -DpushChanges=false \
        -Darguments="-DskipDeploy=true" \
        -Dscm.url=scm:git:https://oauth2:${GITLAB_TOKEN}@gitlab.ops.gopartner.fr/tregusto/tregusto/api.git \
        -Dusername=$GIT_USERNAME \
        -Dpassword=$GITLAB_TOKEN \
        -B
  
      NEXT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
      echo "Next snapshot version: $NEXT_VERSION"

    rules:
      - if: '$CI_COMMIT_BRANCH =~ /^release\//'


  docker-release:
    stage: build-release
    image: docker:25.0
    services:
      - $DIND_IMAGE

    script: |
      echo " Building Docker image for tag $CI_COMMIT_TAG"
      echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin
  
      DOCKER_IMAGE="$REGISTRY_URL/registry/tregusto-backend"
      docker build -t $DOCKER_IMAGE:$CI_COMMIT_TAG .
      docker push $DOCKER_IMAGE:$CI_COMMIT_TAG
    rules:
      - if: '$CI_COMMIT_TAG'


  deploy-release-image:
    stage: deploy-release
    image: docker:25.0
    services:
      - $DIND_IMAGE

    needs:
      - docker-release
    before_script:
      - apk add --no-cache git bash
    script:
      - echo "Updating Helm Chart with tag $CI_COMMIT_TAG"
      - git clone -b HL-1 https://oauth2:${GITLAB_TOKEN}@${GITLAB_BASE_URL}/${HELM_REPO}
      - cd helm-charts/backend-tregusto
      - >
        sed -i "s/tag: \".*\"/tag: \"$CI_COMMIT_TAG\"/" values.yaml
      - git config user.email "$GIT_EMAIL"
      - git config user.name "$GIT_USERNAME"
      - git add values.yaml
      - git commit -m "Update image tag to release $CI_COMMIT_TAG"
      - git push origin HL-1
    rules:
      - if: '$CI_COMMIT_TAG'
