openapi: 3.1.0
info:
  title: Tregusto Authentication API
  description: Authentication endpoints and schemas for Tregusto
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1/authentication
    description: Development server
paths:
  /auth/current-user:
    get:
      tags:
        - authentication
      summary: Get current authenticated user
      description: Returns information about the currently authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Successfully retrieved current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedUser'
        '401':
          description: Unauthorized - User not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - localAuthServer: [ ]
        - bearerAuth: [ ]

components:
  schemas:
    ConnectedUser:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          description: Unique identifier of the user
          example: "123e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          description: Full name of the user
          example: "John Doe"
        firstName:
          type: string
          description: First name of the user
          example: "John"
        lastName:
          type: string
          description: Last name of the user
          example: "Doe"
        email:
          type: string
          format: email
          description: Email address of the user
          example: "john.doe@example.com"

    Error:
      type: object
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        details:
          type: array
          description: Additional details about the error
          items:
            type: object
            properties:
              description:
                type: string
                description: Detailed description of the error
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the error

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token authentication
    localAuthServer:
      type: oauth2
      description: Keycloak OpenID Connect authentication
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:9090/realms/Tregusto/protocol/openid-connect/auth
          tokenUrl: http://localhost:9090/realms/Tregusto/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect scope
