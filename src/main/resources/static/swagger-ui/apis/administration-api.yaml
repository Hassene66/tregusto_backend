openapi: 3.0.2
info:
  title: Administration API
  version: 1.0.0
paths:
  /contact/requests:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
        required: true
      tags:
        - contact
      responses:
        '200':
          description: Successfully created contact request
      operationId: createContactRequest
      summary: Create a new contact request

  /newsletter/confirm:
    get:
      tags:
        - newsletter
      parameters:
        - name: token
          schema:
            type: string
          in: query
          required: true
      responses:
        '200':
          description: Subscription confirmed
        '404':
          description: Invalid or expired token
      operationId: confirmNewsletterSubscription
      summary: Confirm newsletter subscription via token

  /newsletter/subscribe:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterSubscribeRequest'
        required: true
      tags:
        - newsletter
      responses:
        '200':
          description: 'Subscription created, confirmation email sent'
        '400':
          description: Email already subscribed or invalid
      operationId: subscribeToNewsletter
      summary: Subscribe to newsletter (creates pending subscription)

  /newsletter/unsubscribe:
    get:
      tags:
        - newsletter
      parameters:
        - name: token
          schema:
            type: string
          in: query
          required: true
      responses:
        '200':
          description: Unsubscribed successfully
        '404':
          description: Invalid unsubscribe link
      operationId: unsubscribeFromNewsletter
      summary: Unsubscribe from newsletter via token
      description: Unsubscribe using the token from the confirmation email

  /categories:
    get:
      tags:
        - categories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
      operationId: listCategories
      summary: List all active categories
    post:
      tags:
        - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
      operationId: createCategory
      summary: Create a new category

  /categories/{slug}:
    get:
      tags:
        - categories
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
      operationId: getCategoryBySlug
      summary: Get category by slug

  /categories/{id}:
    put:
      tags:
        - categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
      operationId: updateCategory
      summary: Update an existing category
    delete:
      tags:
        - categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Category deactivated
      operationId: deleteCategory
      summary: Deactivate a category

  /products:
    get:
      tags:
        - products
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, popular, default]
        - name: available
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
      operationId: listProducts
      summary: List products with optional filters
    post:
      tags:
        - products
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - categoryId
                - images
              properties:
                name:
                  type: string
                shortDescription:
                  type: string
                longDescription:
                  type: string
                price:
                  type: number
                  format: double
                status:
                  type: string
                  enum: [new, popular, default]
                  default: default
                categoryId:
                  type: integer
                isAvailable:
                  type: boolean
                  default: true
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Product images (first image is main)
        required: true
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      operationId: createProduct
      summary: Create a new product with images

  /products/featured:
    get:
      tags:
        - products
      responses:
        '200':
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
      operationId: getFeaturedProducts
      summary: Get featured products (new or popular)

  /products/{slug}:
    get:
      tags:
        - products
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details with images and ingredients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
      operationId: getProductBySlug
      summary: Get product by slug

  /products/{id}:
    put:
      tags:
        - products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - categoryId
              properties:
                name:
                  type: string
                shortDescription:
                  type: string
                longDescription:
                  type: string
                price:
                  type: number
                  format: double
                status:
                  type: string
                  enum: [new, popular, default]
                  default: default
                categoryId:
                  type: integer
                isAvailable:
                  type: boolean
                  default: true
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Product images (first image is main, replaces all existing images)
        required: true
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
      operationId: updateProduct
      summary: Update an existing product with images
    delete:
      tags:
        - products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Product deactivated
      operationId: deleteProduct
      summary: Deactivate a product

  /products/{productId}/images:
    post:
      tags:
        - product-images
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Gallery image file
                altText:
                  type: string
                displayOrder:
                  type: integer
                  default: 0
        required: true
      responses:
        '201':
          description: Image added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
      operationId: addProductImage
      summary: Add a gallery image to a product

  /products/{productId}/images/{imageId}:
    put:
      tags:
        - product-images
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: New image file (optional, if not provided keeps existing image)
                altText:
                  type: string
                displayOrder:
                  type: integer
                  default: 0
          application/json:
            schema:
              $ref: '#/components/schemas/ProductImageRequest'
      responses:
        '200':
          description: Image updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
        '404':
          description: Image not found
      operationId: updateProductImage
      summary: Update image (metadata and/or file)
    delete:
      tags:
        - product-images
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Image removed
      operationId: deleteProductImage
      summary: Remove an image from a product

  /ingredient-categories:
    get:
      tags:
        - ingredient-categories
      responses:
        '200':
          description: List of ingredient categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngredientCategory'
      operationId: listIngredientCategories
      summary: List all ingredient categories
    post:
      tags:
        - ingredient-categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientCategoryRequest'
        required: true
      responses:
        '201':
          description: Ingredient category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientCategory'
      operationId: createIngredientCategory
      summary: Create a new ingredient category

  /ingredient-categories/{id}:
    put:
      tags:
        - ingredient-categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientCategoryRequest'
        required: true
      responses:
        '200':
          description: Ingredient category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientCategory'
        '404':
          description: Ingredient category not found
      operationId: updateIngredientCategory
      summary: Update an ingredient category
    delete:
      tags:
        - ingredient-categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Ingredient category deleted
      operationId: deleteIngredientCategory
      summary: Delete an ingredient category

  /ingredients:
    get:
      tags:
        - ingredients
      responses:
        '200':
          description: List of ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
      operationId: listIngredients
      summary: List all ingredients
    post:
      tags:
        - ingredients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
        required: true
      responses:
        '201':
          description: Ingredient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
      operationId: createIngredient
      summary: Create a new ingredient

  /ingredients/{slug}:
    get:
      tags:
        - ingredients
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ingredient details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '404':
          description: Ingredient not found
      operationId: getIngredientBySlug
      summary: Get ingredient by slug

  /ingredients/{id}:
    put:
      tags:
        - ingredients
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
        required: true
      responses:
        '200':
          description: Ingredient updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '404':
          description: Ingredient not found
      operationId: updateIngredient
      summary: Update an ingredient
    delete:
      tags:
        - ingredients
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Ingredient deleted
      operationId: deleteIngredient
      summary: Delete an ingredient

  /products/{productId}/ingredients:
    post:
      tags:
        - product-ingredients
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIngredientRequest'
        required: true
      responses:
        '201':
          description: Ingredient linked to product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductIngredient'
      operationId: addIngredientToProduct
      summary: Link ingredient to product
    get:
      tags:
        - product-ingredients
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductIngredient'
      operationId: getProductIngredients
      summary: Get all ingredients for a product

  /products/{productId}/ingredients/{ingredientId}:
    put:
      tags:
        - product-ingredients
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
        - name: ingredientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductIngredientRequest'
        required: true
      responses:
        '200':
          description: Product ingredient updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductIngredient'
        '404':
          description: Not found
      operationId: updateProductIngredient
      summary: Update product ingredient
    delete:
      tags:
        - product-ingredients
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
        - name: ingredientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Ingredient removed from product
      operationId: removeIngredientFromProduct
      summary: Remove ingredient from product

components:
  schemas:
    ContactRequest:
      description: Contact request payload
      required:
        - name
        - email
        - phone
        - message
        - captcha
      type: object
      properties:
        name:
          description: Name of the person submitting the request
          type: string
        email:
          description: Email address of the person
          type: string
        phone:
          description: Phone number of the person
          type: string
        location:
          description: Optional location of the person
          type: string
        message:
          description: Message content of the contact request
          type: string
        captcha:
          description: CAPTCHA token to verify the request is from a human
          type: string

    NewsletterSubscribeRequest:
      required:
        - email
      type: object
      properties:
        email:
          format: email
          description: Email address to subscribe to the newsletter
          type: string

    NewsletterUnsubscribeRequest:
      required:
        - email
      type: object
      properties:
        email:
          format: email
          description: Email address to unsubscribe from the newsletter
          type: string

    NewsletterSubscription:
      type: object
      properties:
        id:
          description: Subscription ID
          type: integer
        email:
          format: email
          description: Subscriber email address
          type: string
        status:
          description: Current subscription status
          enum:
            - pending
            - active
            - unsubscribed
          type: string
        createdAt:
          format: date-time
          description: Subscription creation date
          type: string
        confirmedAt:
          format: date-time
          description: Subscription confirmation date
          type: string

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        isActive:
          type: boolean
        imageUrl:
          type: string
        createdAt:
          format: date-time
          type: string

    CategoryRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string
        imageUrl:
          type: string

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        shortDescription:
          type: string
        longDescription:
          type: string
        price:
          type: number
          format: double
        status:
          type: string
          enum: [new, popular, default]
        rating:
          type: number
          format: double
        category:
          $ref: '#/components/schemas/Category'
        isAvailable:
          type: boolean
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/ProductIngredient'
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string

    ProductRequest:
      required:
        - name
        - price
        - categoryId
      type: object
      properties:
        name:
          type: string
        shortDescription:
          type: string
        longDescription:
          type: string
        price:
          type: number
          format: double
        status:
          type: string
          enum: [new, popular, default]
          default: default
        categoryId:
          type: integer
        isAvailable:
          type: boolean
          default: true

    ProductImage:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        imageUrl:
          type: string
          description: Base64 encoded image (data:image/jpeg;base64,...) or null if file is missing
        altText:
          type: string
        displayOrder:
          type: integer
        createdAt:
          format: date-time
          type: string

    ProductImageRequest:
      required:
        - imageUrl
      type: object
      properties:
        imageUrl:
          type: string
        altText:
          type: string
        displayOrder:
          type: integer
          default: 0

    IngredientCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          format: date-time
          type: string

    IngredientCategoryRequest:
      required:
        - name
      type: object
      properties:
        name:
          type: string

    Ingredient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        categoryId:
          type: integer
        categoryName:
          type: string
        createdAt:
          format: date-time
          type: string

    IngredientRequest:
      required:
        - name
        - categoryId
      type: object
      properties:
        name:
          type: string
        categoryId:
          type: integer

    ProductIngredient:
      type: object
      properties:
        productId:
          type: integer
        ingredientId:
          type: integer
        ingredientName:
          type: string
        quantity:
          type: string
        displayOrder:
          type: integer
        isOptional:
          type: boolean

    ProductIngredientRequest:
      required:
        - ingredientId
      type: object
      properties:
        ingredientId:
          type: integer
        quantity:
          type: string
        displayOrder:
          type: integer
          default: 0
        isOptional:
          type: boolean
          default: false

tags:
  - name: TREGUSTO
    description: ''
  - name: contact
    description: Contact request management
  - name: newsletter
    description: Newsletter subscription management
  - name: categories
    description: Product category management
  - name: products
    description: Product management
  - name: product-images
    description: Product image management
  - name: ingredient-categories
    description: Ingredient category management
  - name: ingredients
    description: Ingredient management
  - name: product-ingredients
    description: Product-ingredient relationship management
