spring:


  application:
    name: Tregusto


  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: ${LIQUIBASE_CHANGELOG:classpath:db/changelog/db.changelog-master.xml}

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KC_CLIENT}
            client-secret: ${KC_CLIENT_SECRET}
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KC_ISSUER_URI}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          principal-claim-name: email
          issuer-uri: ${KC_ISSUER_URI}
          jwk-set-uri: ${KC_JWT_SET_URI}


  datasource:
    url: ${POSTGRESQL_URL}
    username: ${POSTGRESQL_USER}
    password: ${POSTGRESQL_PASS}


  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  logging:
    level:
      org.springframework.security: DEBUG


##################################################
# Application Configuration
##################################################
application:
  config:
    name: "Tregusto"
    public-url: "http://tregusto.dev.gopartner.fr"
    otp-expiration-minutes: 10
  ##################################################
  # CORS Configuration
  ##################################################
  authentication:
    api-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  keycloak:
    base-url: ${KC_BASE_URL}
    realm: ${KC_REALM}
    admin-client-id: ${KC_ADMIN_CLIENT_ID:agriloc}
    client-secret: ${kc_client_secret}
server:
  port: 8082