spring:
  application:
    name: Tregusto
  ##################################################
  # Email Configuration
  ##################################################
  mail:
    host: smtp.gmail.com
    port: 587
    username: gopartner.fr@gmail.com
    password: xkfaazfbcduftfxk
    default-encoding: UTF-8
    properties:
      mail:
        debug: true
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
        mime:
          charset: UTF

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: ${LIQUIBASE_CHANGELOG:classpath:db/changelog/db.changelog-master.yaml}
    default-schema: public
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KC_CLIENT}
            client-secret: ${KC_CLIENT_SECRET}
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${KC_ISSUER_URI}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          principal-claim-name: email
          issuer-uri: ${KC_ISSUER_URI}
          jwk-set-uri: ${KC_JWT_SET_URI}


  datasource:
    url: ${POSTGRESQL_URL}
    username: ${POSTGRESQL_USER}
    password: ${POSTGRESQL_PASS}


  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: fr.gopartner.tregusto.common.infrastructure.CustomPhysicalNamingStrategy
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  logging:
    level:
      org.springframework.security: DEBUG


##################################################
# Application Configuration
##################################################
application:
  config:
    name: "Tregusto"
    public-url: ${APPLICATION_BASE_URL}
    newsletter:
      confirmation-url: ${APPLICATION_BASE_URL}/newsletter/confirm
  upload:
    base-dir: ${UPLOAD_BASE_DIR:uploads}
    max-file-size: ${UPLOAD_MAX_SIZE:5242880}
    allowed-extensions: ${UPLOAD_ALLOWED_EXTENSIONS:jpg,jpeg,png,webp}
  authentication:
    api-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  keycloak:
    base-url: ${KC_BASE_URL}
    realm: ${KC_REALM}
    admin-client-id: ${KC_ADMIN_CLIENT_ID:tregusto}
    client-secret: ${KC_CLIENT_SECRET}
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY}
    verification-url: https://www.google.com/recaptcha/api/siteverify
server:
  port: 8082