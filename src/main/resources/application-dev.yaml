keycloak_base_url: http://localhost:9090
keycloak_realm: Tregusto
keycloak_admin-client_id: tregusto-client-id
keycloak_client_secret: 9B1slGDa7u35LVFEEOUOzNx7Zl6bzbmn


##################################################
# Application configuration properties
##################################################
application:
  config:
    name: "Tregusto"
    public-url: "http://tregusto.dev.gopartner.fr"
    newsletter:
      confirmation-url: "http://localhost:3000/newsletter/confirm"
    restaurant-managers:
      emails:
        - manager1@yopmail.com
        - manager2@yopmail.com
  keycloak:
    base-url: ${keycloak_base_url}
    realm: ${keycloak_realm}
    admin-client-id: ${keycloak_admin-client_id}
    client-secret: ${keycloak_client_secret}
  authentication:
    api-allowed-origins:
      - "http://localhost:3000"
  recaptcha:
    secret-key: 6LejPY8sAAAAAI5rHHuW1GqT5yTh0IVfvnGFDIEC
    verification-url: https://www.google.com/recaptcha/api/siteverify
  upload:
    base-dir: uploads
    max-file-size: 5242880
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp

spring:
  ##################################################
  # Docker Compose Plugin Configuration
  ##################################################
  docker:
    compose:
      lifecycle-management: start-only

  ##################################################
  # Database ORM Configuration
  ##################################################
  datasource:
    url: jdbc:postgresql://localhost:5434/tregusto
    username: tregusto
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: fr.gopartner.tregusto.common.infrastructure.CustomPhysicalNamingStrategy
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ##################################################
  # Liquibase Configuration
  ##################################################
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  ##################################################
  # Keycloak / OAuth2 Configuration
  ##################################################
  security:
    oauth2:
      resourceserver:
        jwt:
          principal-claim-name: email
          issuer-uri: ${keycloak_base_url}/realms/${keycloak_realm}
          jwk-set-uri: ${keycloak_base_url}/realms/${keycloak_realm}/protocol/openid-connect/certs


  ##################################################
  # Email Configuration
  ##################################################
  mail:
    host: smtp.gmail.com
    port: 587
    username: gopartner.fr@gmail.com
    password: xkfaazfbcduftfxk
    default-encoding: UTF-8
    properties:
      mail:
        debug: true
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true
        mime:
          charset: UTF


logging:
  level:
    liquibase: DEBUG
    org.springframework.security: DEBUG